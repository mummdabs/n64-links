
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <title>N64 Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <script>
    const params = new URLSearchParams(location.search);
    const rom = params.get("rom");
    const title = params.get("title") || "Nintendo 64";

    if (!rom || !/^roms\/[^/]+\.(z64|n64|v64)$/i.test(rom)) {
      document.body.innerHTML =
        "<h2 style='color:white'>Juego no configurado o enlace inválido</h2>";
      throw new Error("ROM inválida");
    }

    document.title = title;

    EJS_player = "#game";
    EJS_core = "mupen64plus_next";
    EJS_gameName = title;
    EJS_gameUrl = new URL(rom, location.href).href;
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_controlScheme = "n64";
    EJS_language = "es-ES";
  </script>

  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
